name: Sandbox Google Flights API Anything (read-only)
on:
  push:
    branches:
      - sandbox/google-flights-api-anything-20261022
    paths:
      - '.github/workflows/sandbox-google-flights-api-anything.yml'
permissions:
  contents: read
concurrency:
  group: sandbox-google-flights-api-anything
  cancel-in-progress: true
jobs:
  public-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      API_ANYTHING_HOME: /tmp/jcs-google-flights-home
      JCS_PRODUCTION_DISPATCH: 'false'
      JCS_SUPABASE_WRITE_ENABLED: 'false'
      GOOGLE_ORIGIN: MCI
      GOOGLE_DESTINATION: LAS
      GOOGLE_FLIGHT_DATE: '2026-11-12'
      GOOGLE_CAL_START: '2026-11-01'
      GOOGLE_CAL_END: '2026-11-30'
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out pinned public upstream in disposable directory
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --quiet https://github.com/goodnight000/api-anything.git "$RUNNER_TEMP/api-anything"
          cd "$RUNNER_TEMP/api-anything"
          git checkout --quiet 20cb677039fcfe92d3d9c777aa9362e30ff1fdb8
          test "$(git rev-parse HEAD)" = "20cb677039fcfe92d3d9c777aa9362e30ff1fdb8"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          echo "Pinned upstream commit verified."
      - name: Verify read-only Google Flights contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/api-anything"
          mkdir -p "$API_ANYTHING_HOME"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('sites/google-flights.json','utf8'));
          const want={search:'GET',top:'GET',priceCalendar:'POST'};
          if (s.operations.length!==3) throw Error('Unexpected operations');
          for (const op of s.operations){
            if(op.request.method!==want[op.name]) throw Error('Unexpected method '+op.name);
            const url=new URL(op.request.url);
            if(url.protocol!=='https:'||url.hostname!=='www.google.com')throw Error('Unexpected host');
            if(!op.response?.pick?.length)throw Error('Missing fields');
            if(op.request.headers?.authorization||op.request.headers?.cookie)throw Error('Credential header');
          }
          console.log('SPEC_CHECK_PASS: search GET, top GET, calendar read-only POST; google-only; no auth or cookie headers');
          JS
      - name: Run three public one-way Google Flights calls
        shell: bash
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/api-anything"
          failure=0
          for op in search top priceCalendar; do
            start=$(date +%s%3N)
            if [ "$op" = priceCalendar ]; then
              node dist/cli.js call google-flights "$op" origin=MCI destination=LAS start=2026-11-01 end=2026-11-30 --max-tier 1 > "$RUNNER_TEMP/$op.json" 2> "$RUNNER_TEMP/$op.stderr"
            else
              node dist/cli.js call google-flights "$op" origin=MCI destination=LAS date=2026-11-12 --max-tier 1 > "$RUNNER_TEMP/$op.json" 2> "$RUNNER_TEMP/$op.stderr"
            fi
            code=$?
            finish=$(date +%s%3N)
            echo "OPERATION=$op EXIT=$code ELAPSED_MS=$((finish-start))"
            node -e 'let fs=require("fs");let t=fs.readFileSync(process.argv[1],"utf8");try{let x=JSON.parse(t);let d=x.data;console.log(JSON.stringify({ok:x.ok,class:x.class,tier:x.tier,ms:x.ms,items:Array.isArray(d)?d.length:null,first_three:Array.isArray(d)?d.slice(0,3):undefined,error:x.reason??null}))}catch(e){console.log("UNPARSEABLE_OUTPUT",t.slice(0,800))}' "$RUNNER_TEMP/$op.json"
            if [ "$code" -ne 0 ]; then
              failure=1
              echo "ERROR_DETAIL_BEGIN $op"
              head -c 900 "$RUNNER_TEMP/$op.stderr"
              echo
              echo "ERROR_DETAIL_END $op"
            fi
          done
          echo "API_ANYTHING_OPERATIONS_FAILED=$failure"
          if [ "$failure" -ne 0 ]; then exit 11; fi
      - name: Read-only browser comparator (no credentials)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          BROWSER=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$BROWSER" ]; then echo "BROWSER_UNAVAILABLE"; exit 0; fi
          URL='https://www.google.com/travel/flights?q=Flights%20from%20MCI%20to%20LAS%20on%202026-11-12%20one%20way&hl=en-US&gl=US&curr=USD'
          start=$(date +%s%3N)
          timeout 45 "$BROWSER" --headless --no-sandbox --disable-gpu --no-first-run --user-data-dir="$RUNNER_TEMP/chrome-public-sandbox" --dump-dom "$URL" > "$RUNNER_TEMP/browser.html" 2> "$RUNNER_TEMP/browser.err"
          code=$?
          finish=$(date +%s%3N)
          BYTES=$(wc -c < "$RUNNER_TEMP/browser.html")
          echo "BROWSER_EXIT=$code ELAPSED_MS=$((finish-start)) BYTES=$BYTES"
          if [ "$code" -eq 0 ]; then
            grep -q 'Google Flights' "$RUNNER_TEMP/browser.html" && echo "BROWSER_FLIGHTS_PAGE=true" || echo "BROWSER_FLIGHTS_PAGE=false"
          fi
          echo "PRICE_PARITY=UNVERIFIED; requires comparable parsed fare records, not only an HTML response"
      - name: Independently reconcile browser-loaded page data with API results
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.RUNNER_TEMP;
          const htmlPath = path.join(dir, 'browser.html');
          if (!fs.existsSync(htmlPath)) throw new Error('Browser HTML absent; cannot verify parity');
          const html = fs.readFileSync(htmlPath, 'utf8');
          const pattern = /key:\s*'ds:1',\s*hash:\s*'\d+',\s*data:\s*(\[)/;
          const match = pattern.exec(html);
          if (!match) throw new Error('Google Flights ds:1 data missing from independent browser snapshot');
          let idx = match.index + match[0].lastIndexOf('[');
          const begin = idx;
          let depth = 0, quoted = false, escape = false, finished = -1;
          for (; idx < html.length; idx++) {
            const ch = html[idx];
            if (quoted) {
              if (escape) { escape = false; continue; }
              if (ch === '\\') { escape = true; continue; }
              if (ch === '"') quoted = false;
              continue;
            }
            if (ch === '"') { quoted = true; continue; }
            if (ch === '[') depth++;
            if (ch === ']' && --depth === 0) { finished = idx; break; }
          }
          if (finished < 0) throw new Error('Browser data array did not close');
          const root = JSON.parse(html.slice(begin, finished + 1));
          const readGroup = items => (items || []).map(item => ({
            airline: item?.[0]?.[1],
            price: item?.[1]?.[0]?.[1],
            from: item?.[0]?.[3],
            to: item?.[0]?.[6],
            departureTime: item?.[0]?.[5],
            durationMinutes: item?.[0]?.[9]
          }));
          const sig = x => JSON.stringify([
            x.airline, x.price, x.from, x.to, x.departureTime, x.durationMinutes
          ]);
          let clean = true;
          for (const [name, index] of [['top',2],['search',3]]) {
            const pageItems = readGroup(root?.[index]?.[0]);
            const apiPayload = JSON.parse(fs.readFileSync(path.join(dir, name + '.json'),'utf8'));
            const apiItems = apiPayload?.data;
            if (!Array.isArray(apiItems)) throw new Error(name + ' API items missing');
            const a = pageItems.map(sig).sort();
            const b = apiItems.map(sig).sort();
            const matchAll = JSON.stringify(a) === JSON.stringify(b);
            console.log('PARITY_GROUP=' + name +
              ' browser_items=' + a.length +
              ' api_items=' + b.length +
              ' exact_match=' + matchAll);
            if (!matchAll) {
              clean = false;
              console.log('BROWSER_SAMPLE=' + JSON.stringify(pageItems.slice(0,2)));
              console.log('API_SAMPLE=' + JSON.stringify(apiItems.slice(0,2)));
            }
          }
          console.log('FARE_PARITY=' + (clean ? 'PASS' : 'FAIL_OR_REPRICE'));
          if (!clean) process.exit(12);
          NODE

      - name: Check out sandbox source (not production)
        uses: actions/checkout@v5
      - name: Run expanded multi-route checks with independent browser parity
        shell: bash
        run: node "$GITHUB_WORKSPACE/scripts/google-flights-sandbox-extended.mjs"

      - name: Export sanitized public flight fixture for offline handoff replay
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path');
          const t=process.env.RUNNER_TEMP;
          const read=n=>JSON.parse(fs.readFileSync(path.join(t,n+'.json'),'utf8'));
          const source={search:read('search'),top:read('top'),priceCalendar:read('priceCalendar')};
          for(const [name,res] of Object.entries(source)){
            if(res.ok!==true||res.class!=='ok'||res.tier!==1||!Array.isArray(res.data))throw Error('Invalid '+name);
          }
          const pick=f=>({airline:f.airline,price:f.price,from:f.from,to:f.to,
            departureTime:f.departureTime,durationMinutes:f.durationMinutes,via:f.via??[]});
          const fixture={kind:'PUBLIC_FLIGHT_SANDBOX_FIXTURE',capturedAt:new Date().toISOString(),
            query:{origin:'MCI',destination:'LAS',date:'2026-11-12'},
            calendarQuery:{origin:'MCI',destination:'LAS',start:'2026-11-01',end:'2026-11-30'},
            search:source.search.data.map(pick),top:source.top.data.map(pick),
            calendar:source.priceCalendar.data.map(x=>({date:x.date,price:x.price}))};
          if(!fixture.search.length||!fixture.top.length||!fixture.calendar.length)throw Error('Empty fixture');
          console.log('PUBLIC_FIXTURE_B64='+Buffer.from(JSON.stringify(fixture)).toString('base64'));
          console.log('PUBLIC_FIXTURE_COUNTS='+JSON.stringify({
            search:fixture.search.length,top:fixture.top.length,calendar:fixture.calendar.length
          }));
          JS
